[project]
name = "chatbot_pluviometrico"
version = "0.1.0"
description = "Chatbot de WhatsApp para consulta de dados pluviométricos via Text-to-SQL (CrewAI)"
authors = [{ name = "Nauan Castro", email = "nauanhs1@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai>=0.118.0,<1.0.0",
    "flask>=3.1.2",
    "psycopg2>=2.9.11",
    "requests>=2.30.0",
    "python-dotenv>=1.0.0",
    "sqlparse>=0.5.5",
]

[project.scripts]
chatbot_pluviometrico = "chatbot_pluviometrico.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/src/chatbot_pluviometrico"]

[tool.crewai]
type = "crew"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[dependency-groups]
dev = [
    "ruff>=0.15.19",
]
